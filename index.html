<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task List</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 8px 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #218838; }
        .filter-buttons { display: flex; gap: 5px; margin-bottom: 15px; }
        .filter-btn { padding: 4px 8px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; color: white; width: auto; }
        ul { list-style-type: none; padding: 0; margin-top: 20px; }
        li { background: #e9ecef; padding: 8px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background-color: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>My Task List</h2>
        
        <div class="filter-buttons">
            <button class="filter-btn" data-filter="All" style="background-color: #6c757d;">All</button>
            <button class="filter-btn" data-filter="Work" style="background-color: #007bff;">Work</button>
            <button class="filter-btn" data-filter="Personal" style="background-color: #17a2b8;">Personal</button>
            <button class="filter-btn" data-filter="Shopping" style="background-color: #ffc107; color: black;">Shopping</button>
        </div>

        <div>
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <select id="categoryInput">
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Shopping">Shopping</option>
            </select>
            <button id="addBtn">Add</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
